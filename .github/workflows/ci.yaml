name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: sciarx
          environment-file: conda.yaml
          auto-activate-base: false
          use-mamba: true

      - name: Install Makim
        run: |
          python -m pip install makim

      - name: Run CI via Makim
        run: |
          makim ci
